apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.6.5
    helm:
      values: |
        # ---------- DEPLOYMENT MODE ----------
        deploymentMode: SingleBinary

        # Disable scalable components
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0
        gateway:
          enabled: false
        simpleScalable: {}

        # ---------- LOKI CONFIG (filesystem only) ----------
        loki:
          auth_enabled: false
          storage:
            type: filesystem
          commonConfig:
            replication_factor: 1
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: boltdb-shipper
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          ruler:
            storage:
              type: local
              local:
                directory: /data/rules
          compactor:
            working_directory: /data/boltdb-shipper-compactor
            shared_store: filesystem

        # ---------- SINGLE BINARY POD ----------
        singleBinary:
          replicas: 1
          persistence:
            enabled: false   # disable persistence (no PVCs)
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true