apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-filelog
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.101.1
    helm:
      values: |
        mode: daemonset
        image:
          repository: otel/opentelemetry-collector-contrib

        config:
          extensions:
            file_storage:
              directory: /var/lib/otelcol/positions

          receivers:
            filelog:
              include: [ /var/log/containers/*.log ]
              start_at: beginning
              storage: file_storage
              operators:
                - type: json_parser
                  id: parse-json
                  if: body matches '^\{'
                  parse_from: body

          processors:
            k8sattributes:
              auth_type: serviceAccount
              extract:
                metadata:
                  - k8s.namespace.name
                  - k8s.pod.name
                  - k8s.container.name
                  - k8s.node.name
            batch: {}

          exporters:
            loki:
              endpoint: http://loki.observability.svc.cluster.local:3100/loki/api/v1/push
              tls:
                insecure: true   # allow HTTP (no TLS in-cluster)

          service:
            extensions: [file_storage]
            pipelines:
              logs:
                receivers: [filelog]
                processors: [k8sattributes, batch]
                exporters: [loki]

        extraVolumes:
          - name: varlog
            hostPath:
              path: /var/log/containers
          - name: positions
            emptyDir: {}

        extraVolumeMounts:
          - name: varlog
            mountPath: /var/log/containers
            readOnly: true
          - name: positions
            mountPath: /var/lib/otelcol/positions
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true