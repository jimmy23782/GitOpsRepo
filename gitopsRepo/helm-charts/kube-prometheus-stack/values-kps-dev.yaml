prometheusOperator:
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false
  tls:
    enabled: false
  serviceMonitor:
    selfMonitor: false

# Under your alias (single block — no duplicates)
kps:
  kubeEtcd:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false

  prometheusOperator:
    admissionWebhooks:
      enabled: false
      patch:
        enabled: false
    tls:
      enabled: false
    serviceMonitor:
      selfMonitor: false

  grafana:
    enabled: true
    adminPassword: admin
    service:
      type: ClusterIP
    persistence:
      enabled: false

  alertmanager:
    enabled: false

  prometheus:
    enabled: true
    service:
      type: ClusterIP
    prometheusSpec:
      retention: 7d
      storageSpec: {}
      serviceMonitorSelectorNilUsesHelmValues: false